services:
  default:
    image: "python:3.12-bookworm"
# "*" means allow all domains, which is the `world` entity: the chart must render it
# as one and emit no toFQDNs selector, because a `matchPattern: "*"` selector claims
# every name resolved on the node and evicts other sandboxes' FQDN identities.
allowDomains:
  - "*"
